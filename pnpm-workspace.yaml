packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  # The Agent SDK's installed OpenTelemetry SDKs require an API version below 1.10.
  '@opentelemetry/api': '1.9.1'
  # The older OTLP exporters use this package only for types. Reuse the Agent SDK's version.
  '@opentelemetry/sdk-trace-base@2.2.0': '2.12.1'
  # Drizzle Kit loads TypeScript through tsx. Its previous loader is still declared.
  'drizzle-kit@0.31.11>@esbuild-kit/esm-loader': '-'
  # This release preserves the CommonJS sniffing API used by http-server.
  'http-server@14.1.1>html-encoding-sniffer': '6.0.0'
  # test-exclude 8 makes the same glob upgrade. Avero already requires Node 24 or newer.
  'test-exclude@7.0.2>glob': '13.0.7'

allowBuilds:
  msgpackr-extract: false
  '@carbon/icon-helpers': false
  '@carbon/icons-react': false
  '@grok/agent-sdk': true
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  nx: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

permissions:
  '@grok/agent-sdk':
    skills:
      [
        cli,
        create-agent,
        debug,
        deploy,
        evals,
        framework-map,
        github,
        hillclimb,
        mcp-auth,
        migrate-v2,
        otel,
        setup-slack,
      ]

skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
    - .cursor/skills
    - .gemini/skills
    - .github/skills
minimumReleaseAgeExclude:
  - '@ui-sdk/core@0.1.0-beta.10'
  - '@ui-sdk/react@0.1.0-beta.10'
