name: avero

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: avero
      POSTGRES_USER: avero
      POSTGRES_PASSWORD: ${AVERO_POSTGRES_PASSWORD:-avero-local}
    ports:
      - '127.0.0.1:${AVERO_POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${AVERO_REDIS_PORT:-56379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  redis-data:
