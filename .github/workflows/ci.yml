name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: avero
          POSTGRES_USER: avero
          POSTGRES_PASSWORD: avero-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avero -d avero"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # The database tests run against this service. Without the variable they are skipped.
      AVERO_TEST_DATABASE_URL: postgresql://avero:avero-ci@127.0.0.1:5432/avero
    steps:
      - uses: actions/checkout@v4
        with:
          # Nx compares against the base branch, so it needs the history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        # The version comes from "packageManager" in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - name: Apply migrations to the test database
        run: pnpm exec nx run @avero/db:db:migrate
        env:
          DATABASE_URL: ${{ env.AVERO_TEST_DATABASE_URL }}

      - name: Workspace graph and tags
        run: pnpm verify:workspace

      - name: Formatting
        run: pnpm format:check

      - name: Lint, typecheck, test and build what changed
        run: pnpm exec nx affected -t lint typecheck test build --output-style=static
