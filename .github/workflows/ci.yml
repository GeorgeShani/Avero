name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: avero
          POSTGRES_USER: avero
          POSTGRES_PASSWORD: avero-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avero -d avero"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # The database and queue tests run against these services. Without a variable, its tests are skipped.
      AVERO_TEST_DATABASE_URL: postgresql://avero:avero-ci@127.0.0.1:5432/avero
      AVERO_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with:
          # Nx compares against the base branch, so it needs the history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        # The version comes from "packageManager" in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - name: Apply migrations to the test database
        run: pnpm exec nx run @avero/db:db:migrate
        env:
          DATABASE_URL: ${{ env.AVERO_TEST_DATABASE_URL }}

      - name: Workspace graph and tags
        run: pnpm verify:workspace

      - name: Formatting
        run: pnpm format:check

      - name: Lint, typecheck, test and build what changed
        run: pnpm exec nx affected -t lint typecheck test build --output-style=static

  # The Dockerfiles are what a release builds. Build them here too (without pushing), so a change
  # that breaks an image fails the pull request and not the release.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web, dockerfile: infra/Dockerfile.web }
          - { name: worker, dockerfile: infra/Dockerfile.worker }
          - { name: agent-service, dockerfile: infra/Dockerfile.agent-service }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
